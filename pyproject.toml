[project]
name = "event-aggregation-pipeline"
version = "0.1.0"
description = "Fault-isolated multi-source event aggregation, deduplication, and JSON Schema validation pipeline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "jsonschema>=4.20.0",
  "pydantic>=2.8.0",
  "selectolax>=1.0.0",
]

[dependency-groups]
dev = [
  "basedpyright>=1.18.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
